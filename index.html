<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Serial Pilot</title>
  </head>
  <body>
    <div id="root">
      <!-- 加载骨架屏：React 挂载后自动替换 -->
      <style>
        /* 浅色模式 */
        .app-loading {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: hsl(0 0% 100%);
          color: hsl(220 14% 40%);
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
          font-size: 14px;
          transition: opacity 0.2s;
        }
        /* 深色模式 */
        @media (prefers-color-scheme: dark) {
          .app-loading {
            background: hsl(0 0% 12%);
            color: hsl(0 0% 60%);
          }
          .spinner {
            border-color: hsl(240 2% 20%) !important;
            border-top-color: hsl(207 100% 54%) !important;
          }
        }
        .spinner {
          width: 40px;
          height: 40px;
          border: 3px solid hsl(220 14% 96%);
          border-top-color: hsl(221 83% 53%);
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
        .loading-text {
          margin-top: 20px;
          font-weight: 500;
          letter-spacing: 0.01em;
        }
      </style>
      <div class="app-loading">
        <div class="spinner"></div>
        <div class="loading-text">Starting Serial Pilot...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
