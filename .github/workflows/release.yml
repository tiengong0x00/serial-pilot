name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app (Release only)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build

      - name: List build artifacts
        run: |
          Write-Host "=== Listing build artifacts ==="
          Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" -Recurse
          Get-ChildItem -Path "src-tauri/target/release" -Filter "*.sig" -Recurse
          Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Recurse
          Write-Host "=== End of artifacts ==="

      - name: Prepare portable executable
        run: |
          # 复制绿色版并添加 .portable 标记
          $portableExe = "src-tauri/target/release/serial-pilot.exe"
          $portableOut = "src-tauri/target/release/serial-pilot-portable.exe"

          if (Test-Path $portableExe) {
            Copy-Item $portableExe $portableOut

            # 创建 .portable 标记文件（写入提示信息避免 GitHub 0 字节限制）
            $markerPath = "src-tauri/target/release/.portable"
            Set-Content -Path $markerPath -Value "Serial Pilot Portable Version Marker" -NoNewline
            Write-Host "✓ Portable executable prepared with marker"
          } else {
            Write-Error "Portable executable not found"
            exit 1
          }

      - name: Sign executables
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # 签名 NSIS 安装包
          $nsisSetup = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*setup.exe" | Select-Object -First 1
          if ($nsisSetup) {
            Write-Host "Signing NSIS installer: $($nsisSetup.Name)"
            npm run tauri signer sign $nsisSetup.FullName -- -k "$env:TAURI_SIGNING_PRIVATE_KEY" -p ""
            if (Test-Path "$($nsisSetup.FullName).sig") {
              Write-Host "✓ NSIS installer signed"
            } else {
              Write-Error "Failed to sign NSIS installer"
              exit 1
            }
          } else {
            Write-Error "NSIS installer not found"
            exit 1
          }

          # 签名绿色版
          $portableExe = "src-tauri/target/release/serial-pilot-portable.exe"
          if (Test-Path $portableExe) {
            Write-Host "Signing portable executable..."
            npm run tauri signer sign $portableExe -- -k "$env:TAURI_SIGNING_PRIVATE_KEY" -p ""
            if (Test-Path "$portableExe.sig") {
              Write-Host "✓ Portable executable signed"
              Get-Content "$portableExe.sig"
            } else {
              Write-Error "Failed to sign portable executable"
              exit 1
            }
          } else {
            Write-Error "Portable executable not found"
            exit 1
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/nsis/*setup.exe
            src-tauri/target/release/bundle/nsis/*setup.exe.sig
            src-tauri/target/release/serial-pilot-portable.exe
            src-tauri/target/release/serial-pilot-portable.exe.sig
            src-tauri/target/release/.portable
          generate_release_notes: true

      - name: Generate and upload update manifests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v',''

          # 获取上一个标签
          $tags = git tag --sort=-version:refname
          $currentIndex = $tags.IndexOf($tag)
          $prevTag = if ($currentIndex -lt ($tags.Count - 1)) { $tags[$currentIndex + 1] } else { "" }

          # 生成变更日志
          $releaseInfo = ""
          if ($prevTag) {
            Write-Host "生成从 $prevTag 到 $tag 的变更日志"
            $commits = git log "$prevTag..$tag" --pretty=format:"- %s" --no-merges
            if ($commits) {
              $releaseInfo = "## 更新内容`n`n$commits"
            } else {
              $releaseInfo = "## 更新内容`n`n- 初始版本"
            }
          } else {
            Write-Host "这是第一个版本"
            $commits = git log $tag --pretty=format:"- %s" --no-merges
            if ($commits) {
              $releaseInfo = "## 更新内容`n`n$commits"
            } else {
              $releaseInfo = "## 更新内容`n`n- 初始版本"
            }
          }

          if ([string]::IsNullOrWhiteSpace($releaseInfo)) {
            $releaseInfo = "Version $version"
          }
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")

          # 生成 NSIS 安装版 latest-nsis.json
          $nsisSetup = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*setup.exe" | Select-Object -First 1
          if ($nsisSetup) {
            $nsisUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/$($nsisSetup.Name)"
            $nsisSigFile = Get-Item "$($nsisSetup.FullName).sig" -ErrorAction SilentlyContinue
            $nsisSignature = ""
            if ($nsisSigFile) {
              $nsisSignature = (Get-Content $nsisSigFile.FullName -Raw -Encoding UTF8).Trim()
              Write-Host "✓ NSIS signature: $($nsisSignature.Length) chars"
            }

            $latestNsis = @{
              version = $version
              notes = [string]$releaseInfo
              pub_date = $pubDate
              platforms = @{
                "windows-x86_64" = @{
                  signature = $nsisSignature
                  url = $nsisUrl
                }
              }
            }

            $json = $latestNsis | ConvertTo-Json -Depth 10 -Compress:$false
            [System.IO.File]::WriteAllLines("latest-nsis.json", $json, [System.Text.UTF8Encoding]::new($false))
            Write-Host "✓ Generated latest-nsis.json"

            gh release upload $tag latest-nsis.json --clobber
          } else {
            Write-Error "NSIS installer not found"
            exit 1
          }

          # 生成绿色版 latest-portable.json
          $portableExe = "src-tauri/target/release/serial-pilot-portable.exe"
          if (Test-Path $portableExe) {
            $portableUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/serial-pilot-portable.exe"
            $portableSigFile = Get-Item "$portableExe.sig" -ErrorAction SilentlyContinue
            $portableSignature = ""
            if ($portableSigFile) {
              $portableSignature = (Get-Content $portableSigFile.FullName -Raw -Encoding UTF8).Trim()
              Write-Host "✓ Portable signature: $($portableSignature.Length) chars"
            }

            $latestPortable = @{
              version = $version
              notes = [string]$releaseInfo
              pub_date = $pubDate
              platforms = @{
                "windows-x86_64" = @{
                  signature = $portableSignature
                  url = $portableUrl
                }
              }
            }

            $json = $latestPortable | ConvertTo-Json -Depth 10 -Compress:$false
            [System.IO.File]::WriteAllLines("latest-portable.json", $json, [System.Text.UTF8Encoding]::new($false))
            Write-Host "✓ Generated latest-portable.json"

            gh release upload $tag latest-portable.json --clobber
          } else {
            Write-Error "Portable executable not found"
            exit 1
          }

