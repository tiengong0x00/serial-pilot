name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app (Release only)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build

      - name: List build artifacts
        run: |
          Write-Host "=== Listing build artifacts ==="
          Get-ChildItem -Path "src-tauri/target/release" -Filter "*.exe" -Recurse
          Get-ChildItem -Path "src-tauri/target/release" -Filter "*.sig" -Recurse
          Write-Host "=== End of artifacts ==="

      - name: Sign portable executable
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # 使用 tauri signer 手动签名绿色版
          $portableExe = "src-tauri/target/release/serial-pilot.exe"
          if (Test-Path $portableExe) {
            Write-Host "Signing portable executable..."
            npm run tauri signer sign $portableExe -- -k "$env:TAURI_SIGNING_PRIVATE_KEY" -p ""
            Write-Host "✓ Portable executable signed"

            # 验证签名文件生成
            if (Test-Path "$portableExe.sig") {
              Write-Host "✓ Signature file created: $portableExe.sig"
              Get-Content "$portableExe.sig"
            } else {
              Write-Error "Failed to create signature file"
              exit 1
            }
          } else {
            Write-Error "Portable executable not found"
            exit 1
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/serial-pilot.exe
            src-tauri/target/release/serial-pilot.exe.sig
          generate_release_notes: true

      - name: Generate and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取最新 release 信息生成 latest.json（仅绿色版）
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v',''

          # 获取上一个标签
          $tags = git tag --sort=-version:refname
          $currentIndex = $tags.IndexOf($tag)
          $prevTag = if ($currentIndex -lt ($tags.Count - 1)) { $tags[$currentIndex + 1] } else { "" }

          # 生成变更日志
          $releaseInfo = ""
          if ($prevTag) {
            Write-Host "生成从 $prevTag 到 $tag 的变更日志"
            $commits = git log "$prevTag..$tag" --pretty=format:"- %s" --no-merges
            if ($commits) {
              $releaseInfo = "## 更新内容`n`n$commits"
            } else {
              $releaseInfo = "## 更新内容`n`n- 初始版本"
            }
          } else {
            Write-Host "这是第一个版本"
            $commits = git log $tag --pretty=format:"- %s" --no-merges
            if ($commits) {
              $releaseInfo = "## 更新内容`n`n$commits"
            } else {
              $releaseInfo = "## 更新内容`n`n- 初始版本"
            }
          }

          if ([string]::IsNullOrWhiteSpace($releaseInfo)) {
            $releaseInfo = "Version $version"
          }
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")

          # 生成绿色版 latest.json
          $portable = Get-ChildItem -Path "src-tauri/target/release" -Filter "serial-pilot.exe" -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($portable) {
            $portableUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/serial-pilot.exe"

            # 查找对应的 .sig 签名文件并读取为 Base64
            $sigFile = Get-ChildItem -Path "src-tauri/target/release" -Filter "serial-pilot.exe.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
            $signature = ""
            if ($sigFile) {
              # 读取签名文件内容（minisign 格式是文本）
              $sigContent = Get-Content $sigFile.FullName -Raw -Encoding UTF8
              $signature = $sigContent.Trim()
              Write-Host "✓ Found signature file: $($sigFile.Name)"
              Write-Host "Signature content length: $($signature.Length)"
            } else {
              Write-Host "⚠ Warning: No signature file found, update may not work"
            }

            $latestJson = @{
              version = $version
              notes = [string]$releaseInfo
              pub_date = $pubDate
              platforms = @{
                "windows-x86_64" = @{
                  signature = $signature
                  url = $portableUrl
                }
              }
            }

            $json = $latestJson | ConvertTo-Json -Depth 10 -Compress:$false
            [System.IO.File]::WriteAllLines("latest.json", $json, [System.Text.UTF8Encoding]::new($false))
            Write-Host "✓ Generated latest.json for portable version"

            # 上传 latest.json 到 release
            gh release upload $tag latest.json --clobber
          } else {
            Write-Error "未找到绿色版 serial-pilot.exe"
            exit 1
          }

